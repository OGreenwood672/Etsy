<!DOCTYPE html>
<head>

    <link rel="stylesheet" href="./index.css">
    
</head>
<body onload="onPageLoad()">

    <div class="ui">
        <div>
            <label for="client">Client: </label>
            <input id="client" type="number" onchange="UpdateCookie('client', this.value)">
        </div>

        <div>
            <label for="invertcolours">Invert Colours</label>
            <input id="invertcolours" type="checkbox" value="false" onclick="UpdateRules('InvertColours', this.checked)">
        </div>

        <div>
            <label>Threshold 1</label>
            <input id="threshold1" type="range" min="0" max="300" value="0" onchange="UpdateRules('EdgeThreshold1', this.value)">
        </div>
        <div class="ui">
            <label>Threshold 2</label>
            <input id="threshold2" type="range" min="0" max="300" value="0" onchange="UpdateRules('EdgeThreshold2', this.value)">
        </div>
    </div>

    <div>
        <img id="result" class="image">
        <img id="original" class="image">
    </div>

</body>

<script>

async function UpdateRules(rule, val) {

    ClientNumber = await GetCookie("client");

    const response = await fetch("http://127.0.0.1:5000/rules", {
        method: "POST",
        mode: "cors",
        cache: "no-cache",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
        },
        referrerPolicy: "no-referrer",
        body: JSON.stringify({
            "client": ClientNumber, 
            "rule" : rule,
            "value": val
        }),
    });

    if (response.ok) {
        let json = await response.json();
    } else {
        alert("HTTP-Error: " + response.status);
    }
}

async function GetRuleValue(RuleName) {

    ClientNumber = await GetCookie("client");

    response = await fetch(`../clients/${ClientNumber}/Rules.json`);
    data = await response.json();

    if (RuleName in data) {
        return data[RuleName];
    } else {
        response = await fetch("../DefaultRules");
        data = response.json();
        return data[RuleName];
    }
}

async function GetCookie(cookie) {

    response = await fetch(`http://127.0.0.1:5000/cookie`);
    data = await response.json();

    return data[cookie];
}

async function UpdateCookie(cookie, val) {

    const response = await fetch("http://127.0.0.1:5000/cookie", {
        method: "POST",
        mode: "cors",
        cache: "no-cache",
        credentials: "same-origin",
        headers: {
            "Content-Type": "application/json",
        },
        referrerPolicy: "no-referrer",
        body: JSON.stringify({
            "cookie": cookie,
            "value": val
        }),
    });

    if (response.ok) {
        let json = await response.json();
    } else {
        alert("HTTP-Error: " + response.status);
    }
}

async function onPageLoad() {

    ClientInput = document.getElementById("client");
    client = await GetCookie("client");
    ClientInput.value = client;

    OriginalImg = document.getElementById("original");
    OriginalImg.src = `../clients/${client}/Original.png`;

    ResultImg = document.getElementById("result");
    ResultImg.src = `../clients/${client}/Result.png`;

    threshold1Slider = document.getElementById("threshold1");
    t1 = await GetRuleValue("EdgeThreshold1");
    threshold1Slider.value = t1;

    threshold2Slider = document.getElementById("threshold2");
    t2 = await GetRuleValue("EdgeThreshold2");
    threshold2Slider.value = t2;

    InvertCheck = document.getElementById("invertcolours");
    ic = await GetRuleValue("InvertColours");
    InvertCheck.checked = ic;
}



</script>
